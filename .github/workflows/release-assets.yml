name: Release assets

# Attaches the artifacts of a finished Release run to the GitHub release for its tag, from a
# GitHub runner (fast uploads). Used when the release run built everything but the PyPI
# publish step could not run yet (for example before the trusted publisher was registered).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the Release workflow whose artifacts to attach"
        required: true
      tag:
        description: "Tag of the release (for example v0.1.1)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: "*-app"
          merge-multiple: true
          path: dist/
      - run: ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
          generate_release_notes: true
